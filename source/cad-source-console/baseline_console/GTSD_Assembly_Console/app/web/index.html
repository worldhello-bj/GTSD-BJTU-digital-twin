<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTSD · 新CAD整机与虚拟控制台</title><link rel="stylesheet" href="/assembly/style.css"></head><body>
<header><div><span class="eyebrow">GTSD / SOURCE-REGISTERED ASSEMBLY</span><h1>新CAD整机 · 来源与求解绑定</h1><p>当前候选构型与已验收求解器分开核对。所有操作仅作用于云端虚拟模型。</p></div><a href="/">打开完整求解控制台 ↗</a></header>
<div class="warning" id="boundary">几何候选：第二站朝向与孔中心仍有图版冲突；4079/B535接口穿料保留，新夹持件碰撞未启用。</div>
<main><aside><h2>构型与范围</h2><label>互斥来源构型<select id="scene"></select></label><label>显示范围<select id="scope"><option value="all">完整台架与车辆</option><option value="vehicle">车辆</option><option value="bogie">转向架</option><option value="pantograph">受电弓</option><option value="upper">上夹具 / 连杆</option><option value="lower">下支承 / 槽板</option></select></label><div class="row"><button id="fit">复位视角</button><button id="isolate">仅选中件</button><button id="restore-view">恢复范围</button></div><label><input type="checkbox" id="live">仅已验证可视绑定跟随真实姿态</label><p id="mapping-status">映射待核验，当前全部静态。</p><p id="scene-note"></p><h2>逐件定位</h2><input id="search" type="search" placeholder="网格名、部件ID、原生刚体"><p id="match-count"></p><div id="results"></div></aside>
<section class="workspace"><div class="stage"><canvas id="model" aria-label="真实源网格三维视图"></canvas><div class="stage-badge" id="geometry-status">正在校验完整源模型…</div></div><div id="render-status" class="status"></div><p id="error" role="alert"></p><section class="runtime"><div><h2>真实求解会话</h2><p id="runtime-status">正在读取…</p></div><div class="row"><button id="run">运行</button><button id="pause">暂停</button><button id="step">单步</button></div><p id="command-status">这些按钮调用同一冻结 strict82 会话；切换CAD构型只改变显示。</p><pre id="identity"></pre></section><section class="detail"><h2 id="selected-name">选择部件查看来源</h2><p id="binding-detail"></p><pre id="source-detail">单击画面，或从左侧按名称定位。拖动旋转，滚轮缩放。</pre></section></section></main>
<script src="/assembly/model.js"></script><script src="/assembly/lineage.js"></script><script src="/assembly/core.js"></script><script src="/assembly/app.js"></script></body></html>
