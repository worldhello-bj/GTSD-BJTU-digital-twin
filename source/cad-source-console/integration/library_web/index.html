<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTSD · 逐源候选审阅</title><link rel="stylesheet" href="/source-dimensions/style.css"><style>#view[hidden]{display:none!important}</style></head><body><header><h1>逐源参照与可切换几何解释</h1><a href="/assembly">返回整机</a><p>这里展示未能唯一实装的原生源图、候选厚度/回转解释。<span id="state-count">来源审阅状态</span>每次只载入一个，保留缺值与来源冲突。312个独立定义保持各自源坐标。</p></header><main><section><label>检索来源<input id="resource-search" type="search" placeholder="名称、定义、原生标注或状态ID"></label><p id="search-status"></p><label>互斥来源版本<select id="resource"></select></label><p id="note"></p><p id="evidence-level"></p><div class="row"><button id="fit">复位</button><button id="focus">聚焦所选</button><select id="parts"></select><button id="isolate">仅所选</button><button id="all">全部本源</button></div><canvas id="view"></canvas><p id="render-status"></p><p id="error" role="alert"></p></section><aside><h2>选中来源</h2><p>出处字段是审阅来源标识；未随公共增量提供的证据文件不构成可下载链接或运行依赖。</p><pre id="detail"></pre><h2>逐条审计与边界</h2><p id="audit-summary">当前审计摘要加载中。</p><h2>未实例化斜视源</h2><p>1138条原生曲线全部读取/连接核对；完整三维缺投影与正交深度。</p><a href="/source-library/oblique.svg">打开原生曲线参照 SVG</a></aside></main><script src="/assembly/model.js"></script><script src="/assembly/core.js"></script><script src="/source-library/app.js"></script></body></html>
