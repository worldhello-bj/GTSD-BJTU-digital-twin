<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTSD 参数与来源</title><link rel="stylesheet" href="/operational-rig/style.css"><script defer src="/operational-rig/core.js"></script><script defer src="/operational-rig/parameters.js"></script></head>
<body><header class="masthead"><div><p class="eyebrow">GTSD / PARAMETERS</p><h1>参数与来源</h1><p class="subtitle">默认值、工程假设与装配依据</p></div><a href="/operational-rig">返回控制台 ↗</a></header>
<main class="parameters-layout"><section class="panel"><div class="parameters-intro"><p>质量、刚度、摩擦与间隙采用以下工程假设，尚无实测标定。几何沿固定来源；保存修改后，返回控制台开始新会话。</p></div><div class="source-legend"><span>CAD 来源：几何与装配坐标</span><span>工程假设：待标定的物理参数</span><span>数值设置：求解与运行时程</span></div><p id="run-budget" class="muted"></p><p id="parameters-error" role="alert"></p><div id="parameter-fields"><p class="muted">正在读取参数…</p></div><div class="parameter-actions"><button id="save-parameters" class="primary" disabled>保存参数</button><button id="reset-parameters" disabled>恢复默认值</button><p id="save-status" aria-live="polite"></p></div><details><summary>完整参数 JSON</summary><label><span class="sr-only">参数 JSON</span><textarea id="parameters-json" rows="20" spellcheck="false"></textarea></label><button id="apply-json" class="quiet" disabled>从 JSON 更新上方参数</button></details><details><summary>装配连接与接触配置</summary><pre id="assembly-contract">读取中…</pre></details><p class="source-boundary">参数修改仅在下次开始新会话时应用。检查点保存的是当前会话的求解状态与能量账。</p></section></main><footer><span>GTSD 虚拟装配</span><a href="/operational-rig">回到运行界面</a></footer></body></html>
