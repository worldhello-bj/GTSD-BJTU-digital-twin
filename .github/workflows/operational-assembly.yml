name: Operational assembly

on:
  pull_request:
    paths:
      - 'source/cad-source-console/**'
      - '.github/workflows/operational-assembly.yml'
  push:
    branches: [main]
    paths:
      - 'source/cad-source-console/**'
      - '.github/workflows/operational-assembly.yml'

permissions:
  contents: read

jobs:
  native-and-console:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source/cad-source-console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Restore and verify repository assets
        run: python prepare_assets.py
      - name: Install pinned runtime and DOM test dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --prefix operational_rig
      - name: Native, session and HTTP unit regressions
        run: python -m unittest discover -s operational_rig/tests -p 'test_*.py' -v
      - name: Console DOM regressions
        run: npm test --prefix operational_rig
      - name: Real HTTP commands and exact native recovery
        run: python operational_rig/verify_http_native.py --complete-demo --output /tmp/gtsd-operational-http
      - name: Captured HTTP telemetry and binding in actual DOM
        run: node operational_rig/tests/verify_native_ui_bundle.js /tmp/gtsd-operational-http
      - name: Complete default motion and contact ledger
        run: python operational_rig/verify_default_motion.py --output /tmp/gtsd-operational-motion
